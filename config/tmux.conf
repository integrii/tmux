# set the command prefix
set -g prefix C-Space
set-option -g prefix C-Space

# C-Space C-Space for last window
bind-key C-Space last-window

# Use vim keys for previous and next windows, like p and n.
bind-key h previous-window
bind-key l next-window

# start window numbering at 1
set -g base-index 1
bind-key 0 select-window -t :=10

# Fit shared windows to the smallest attached client.
set -g window-size smallest
setw -g aggressive-resize on

# supposedly there is a delay after the escape key. this kills it
set -s escape-time 0

# Activity monitoring
set -g monitor-activity off

# make the key bindings work like VIM
set-option -g status-keys vi
setw -g mode-keys vi

# use vim keys to switch panes without a leader (just hold control).  the if-shell here prevents looping selection.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "if-shell '[[ #{pane_at_left} -eq 1 ]]' '' 'select-pane -L'"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "if-shell '[[ #{pane_at_bottom} -eq 1 ]]' '' 'select-pane -D'"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "if-shell '[[ #{pane_at_top} -eq 1 ]]' '' 'select-pane -U'"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "if-shell '[[ #{pane_at_right} -eq 1 ]]' '' 'select-pane -R'"

# Time (clock-mode)
bind t clock-mode
unbind-key T
set -g clock-mode-style 12

# Menu border style
set -g menu-border-lines heavy

# Pane border style
set -g pane-border-lines heavy
setw -g pane-border-status off

# AI harness picker
bind a display-menu -T "AI Harness" -x C -y C \
  "Claude"   c "new-window 'zsh -ic claude'" \
  "Codex"    x "new-window 'zsh -ic codex'" \
  "OpenCode" o "new-window 'zsh -ic opencode2'"

set -g wrap-search off

# Jump to prompt (copy mode + search backward)
bind u copy-mode \; send-keys -X search-backward "  "


# Bind horizontal and vertical splits to more memorable sequences that open in the same path
unbind-key %
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# swap marked pane with current pane with b
bind-key b swap-pane

# cycle through the layouts I actually use
bind-key Space run-shell 'layout="$(tmux show-option -gqv @layout_toggle)"; case "$layout" in even-horizontal) layout=main-vertical ;; main-vertical) layout=tiled ;; *) layout=even-horizontal ;; esac; tmux set-option -gq @layout_toggle "$layout"; tmux select-layout "$layout"'

# fix the title on the mac terminal app
set -g set-titles on
set -g set-titles-string "#I:#W"

# rename windows automatically
set -g allow-rename on
set -g automatic-rename on
set -g automatic-rename-format '#{?#{!=:#(~/.sh/tmux-pane-icon.sh #{pane_pid} #{pane_current_path} #{window_id} #{pane_current_command}),},#(~/.sh/tmux-pane-icon.sh #{pane_pid} #{pane_current_path} #{window_id} #{pane_current_command}),#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}}' # tool = name via script + @pane_icon option, zsh = dir, else = command
set -g set-titles on # update the virtual terminal's window information

# refresh the status bar every second; status scripts cache expensive work
set -g status-interval 1

# reload changes in tmux with C-s r
bind r source-file ~/.config/tmux/tmux.conf

# trigger a rename on all windows to update activity-based colors instantly
set-hook -g after-select-window "set-window-option -g automatic-rename on"


set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g allow-passthrough on      # let terminal escape sequences pass through (needed for Ghostty notifications)
set -g status-position top       # move status bar to top of screen
# pane border colors set in theme/integrii.conf

# set the window options center
#set -g status-justify centre

# enable mouse input
set -g mouse on

# click the weather in status-left to show the wttr.in forecast in a centered popup (output is 125x40, popup adds 5 cols and 5 rows), or the alert icon to show the full NWS alert text in a centered popup (45% of client height, max 75 rows). Both popups set an explicit black background, so Ghostty background-opacity does not make them transparent
# click a context or podman name to reveal it for five seconds; click the full name to open its picker
# namespace clicks open kubens directly
# click the directory in status-right to open the active pane directory with xdg-open on Linux or open on macOS
# click the battery in status-right to open btop in a full-screen popup
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},weather}' \
  { display-popup -E -x C -y C -w 130 -h 45 -s bg=#000000 -T ' wttr.in ' '$HOME/.sh/tmux-weather-popup.sh' } \
  { if -F '#{==:#{mouse_status_range},weather-alert}' \
    { run -b '$HOME/.sh/tmux-weather-alerts-popup.sh "#{client_name}"' } \
    { if -F '#{==:#{mouse_status_range},kube}' \
      { run -b 'bash "$HOME/.sh/tmux-status-reveal.sh" kube' } \
      { if -F '#{==:#{mouse_status_range},kube-full}' \
        { display-popup -E -w 100% -h 100% -T ' kubectx ' 'kubectx; rm -f /tmp/tmux_kubectl_status; tmux refresh-client -S' } \
      { if -F '#{==:#{mouse_status_range},kube-ns}' \
        { display-popup -E -w 100% -h 100% -T ' kubens ' 'kubens; rm -f /tmp/tmux_kubectl_status; tmux refresh-client -S' } \
        { if -F '#{==:#{mouse_status_range},podman}' \
          { run -b 'bash "$HOME/.sh/tmux-status-reveal.sh" podman' } \
          { if -F '#{==:#{mouse_status_range},podman-full}' \
            { display-popup -E -x C -y C -w 50 -h 20 -T ' podman ' '$HOME/.sh/podman-select.sh' } \
          { if -F '#{==:#{mouse_status_range},directory}' \
            { run -b 'if command -v xdg-open >/dev/null; then xdg-open "#{pane_current_path}"; else open "#{pane_current_path}"; fi' } \
            { if -F '#{==:#{mouse_status_range},battery}' \
              { display-popup -E -w 100% -h 100% -s bg=#000000 -T ' btop ' 'btop' } \
              { select-window; set-option -F @drag_window '#{window_id}' } } } } } } } } }

# Swap the grabbed window with the window under the pointer as it moves.
bind -n MouseDrag1Status run-shell -C 'swap-window -d -s #{@drag_window}'
bind -n MouseDragEnd1Status set-option -u @drag_window

# open new windows in the home directory (used to be current pane path)
#bind c new-window -c "#{pane_current_path}"
bind c new-window

# TMUX Screen savers
set-option -g lock-after-time 7200
#set -g lock-command "cbonsai -S" # cbonsai
#set -g lock-command "dvd" # dvd bounce
#set -g lock-command "cmatrix -s"
#set-option -g lock-after-time 600
#set -g lock-command "cbonsai -S" # cbonsai
set -g lock-command "cmatrix -sb -C green -u3" # cmatrix # lags on 45in ghostty
#set-option -g lock-command 'tmux clock' # start a clock

# search backwards through prompt lines with F12 (like command-shift on macos)
bind-key -n F12 copy-mode \; send-keys -X search-backward "  "
bind-key -n S-F12 copy-mode \; send-keys -X search-forward "  "

# mouse scroll smoothing
set -g @scroll-speed-num-lines-per-scroll 1

# integrii theme
source-file ~/.config/tmux/theme/integrii.conf
source-file ~/.config/tmux/theme/modules.conf

# Window picker: centered, searchable, with per-pane agent and Git metadata.
setw -g mode-style 'fg=#FFFFFF,bg=#0060CC'
setw -g copy-mode-selection-style 'fg=#000000,bg=#FFD800'
bind w run-shell -b 'PICKER_CLIENT="#{client_name}" PICKER_WINDOW="#{window_id}" python3 "$HOME/.sh/tmux-window-picker.py" --popup'

# Agent state appears in window tabs. Keep Shift-A unbound.
unbind-key A

# resize modules based on terminal width and battery state
set-hook -g client-resized 'run-shell "~/.sh/resize-tmux-modules.sh"'
set-hook -g session-created 'run-shell "~/.sh/resize-tmux-modules.sh"'
set-hook -g window-linked 'run-shell "~/.sh/resize-tmux-modules.sh"'

# Re-run module script periodically to pick up battery changes (via status-interval)
# Removed pane-focus-in hook — it fired on every pane switch, which was excessive

# Tell TPM where plugins live (moved from ~/.tmux/plugins to XDG path)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

# Enable TPM for plugins
set -g @plugin 'tmux-plugins/tpm' # tmux plugin manager
set -g @plugin 'tmux-plugins/tmux-sensible' # sensible tmux defaults plugin
set -g @plugin 'tmux-plugins/tmux-yank' # make macos clipboard work
set -g @plugin 'christoomey/vim-tmux-navigator' # unified navigation
#set -g @plugin 'tmux-plugins/tmux-cpu' # cpu display
set -g @plugin 'xamut/tmux-weather' # weather
set -g @plugin 'nhdaly/tmux-better-mouse-mode' # improved mouse controls
set -g @plugin 'tmux-plugins/tmux-copycat' # escape key + / to search history

# Ensure no gaps between window tabs
set -g window-status-separator ""

# Replace the window list overflow markers with ellipses
run-shell '~/.config/tmux/scripts/list-markers.sh'

# Keep location and machine-specific values in the untracked local.conf.
set -g @weather_location 'YOUR_LOCATION'
if-shell '[ -f ~/.config/tmux/local.conf ]' 'source-file ~/.config/tmux/local.conf'

# Load TPM from the standard config path or Homebrew on macOS.
run-shell 'if [ -x "$HOME/.config/tmux/plugins/tpm/tpm" ]; then exec "$HOME/.config/tmux/plugins/tpm/tpm"; elif [ -x /opt/homebrew/opt/tpm/share/tpm/tpm ]; then exec /opt/homebrew/opt/tpm/share/tpm/tpm; fi'
